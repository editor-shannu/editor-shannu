<text x="56" y="112" fill="#67e8f9" font-family="monospace" font-size="14">$ whoami</text><text x="56" y="151" fill="#f8fafc" font-family="Arial,sans-serif" font-size="25" font-weight="700">Curious by nature. Builder by choice.</text><text x="56" y="184" fill="#94a3b8" font-family="Arial,sans-serif" font-size="15">Final-year B.Tech student in Artificial Intelligence &amp; Machine Learning.</text><text x="56" y="207" fill="#94a3b8" font-family="Arial,sans-serif" font-size="15">I enjoy turning complex ideas into practical, thoughtful experiences.</text>
